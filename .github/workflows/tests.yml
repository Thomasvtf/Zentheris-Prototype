name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Instalar dependencias
        working-directory: ./api
        run: uv sync --all-extras --dev

      - name: Revisar estilo de codigo
        working-directory: ./api
        run: uv run ruff check .

      - name: Ejecutar pruebas
        working-directory: ./api
        run: uv run pytest --cov=app --cov-report=term

      - name: Comprobar integracion (copias SHA-256, contrato, routers y mapa)
        working-directory: ./api
        run: uv run python ../scripts/check_integration.py

      - name: Lint oficial del contrato (C-02, DC-46)
        run: npx --yes @redocly/cli@2.71.2 lint docs/api/zentheris-api-v0.2.5.yaml --config docs/api/redocly.yaml
