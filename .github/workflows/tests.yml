name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Instalar dependencias
        working-directory: ./api
        run: uv sync --all-extras --dev

      - name: Revisar estilo de codigo
        working-directory: ./api
        run: uv run ruff check .

      - name: Ejecutar pruebas
        working-directory: ./api
        run: uv run pytest --cov=app --cov-report=term

      - name: Comprobar integracion (copias SHA-256, contrato, routers, app y mapa)
        working-directory: ./api
        run: uv run python ../scripts/check_integration.py

      - name: Lint oficial del contrato (C-02, DC-46)
        run: npx --yes @redocly/cli@2.71.2 lint docs/api/zentheris-api-v0.2.5.yaml --config docs/api/redocly.yaml

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Declaraciones de Expo (expo-env.d.ts, ignorado por git)
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas (formatos y textos)
        run: npm test -- --ci

      - name: Tokens al dia con docs/diseno/tokens.json
        run: node scripts/generate-tokens.mjs --check

      - name: Tipos de la API al dia con el contrato
        run: |
          npm run generate:api-types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Empaquetar la app (Android)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
