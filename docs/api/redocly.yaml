# Configuración del linter oficial elegido (DC-46). Correr desde 03_api/:
#   npx @redocly/cli@latest lint zentheris-api-v0.2.5.yaml
# Resultado esperado para congelar el contrato: 0 errores. Los avisos se revisan y se anotan.
extends:
  - recommended
rules:
  operation-operationId-unique: error
  operation-2xx-response: error
  operation-4xx-response: warn
  no-unresolved-refs: error
  security-defined: error
  path-parameters-defined: error
  no-unused-components: warn
  info-license: off
  operation-summary: error
  tag-description: warn
